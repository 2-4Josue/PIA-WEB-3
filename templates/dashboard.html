<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherwood - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar mb-5 shadow-lg" style="background-color: #080808; border-bottom: 1px solid #333;">
        <div class="container">
            <span class="navbar-brand mb-0 h1">AETHERWOOD STUDIO</span>
            <a href="/" class="btn btn-outline-danger btn-sm" style="font-family: 'Cormorant Garamond';">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">Registrar Citas</div>
                    <div class="card-body p-4">
                        <form method="POST" action="/dashboard" id="registroForm">
                            <div class="mb-3">
                                <label class="form-label text-secondary">Cliente</label>
                                <input type="text" class="form-control" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-secondary">Sello / Diseño</label>
                                <input type="text" class="form-control" name="tatuaje" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-secondary">Día de la cita</label>
                                <input type="date" class="form-control" name="fecha" required>
                            </div>
                            <button type="submit" class="btn btn-darks w-100">Guardar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Registro de Clientes</span>
                        <button id="btnOcultar" class="btn btn-sm btn-outline-danger" style="font-family: 'Cormorant Garamond';">Ocultar Visiones</button>
                    </div>
                    <div class="card-body p-0" id="tablaContenedor">
                        <div class="table-responsive m-3">
                            <table class="table table-dark table-hover align-middle" style="background-color: transparent;">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Cliente</th>
                                        <th>Tatuaje</th>
                                        <th>Fecha</th>
                                        <th>Modificar</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for cliente in clientes %}
                                    <tr>
                                        <!-- Aplicamos text-white a todos los datos -->
                                        <td class="fw-bold text-white" style="font-size: 1.2rem;">{{ cliente.nombre }}</td>
                                        <td class="text-white">{{ cliente.tatuaje }}</td>
                                        <td class="text-white">{{ cliente.fecha }}</td>
                                        <td>
                                            <a href="/editar/{{ loop.index0 }}" class="btn btn-sm btn-outline-danger" style="font-family: 'Cormorant Garamond';">Modificar</a>
                                        </td>
                                    </tr>
                                    {% else %}
                                    <tr>
                                        <td colspan="4" class="text-center text-muted py-5" style="font-style: italic;">El grimorio está vacío...</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#btnOcultar").click(function(){
                $("#tablaContenedor").slideToggle(600);
            });
        });
    </script>
</body>
</html>
