<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Registro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-warning text-dark font-monospace fw-bold">Actualizar Datos</div>
                    <div class="card-body">
                        <form method="POST" action="/editar/{{ id }}">
                            <div class="mb-3">
                                <label class="form-label">Nombre del Cliente</label>
                                <input type="text" class="form-control" name="nombre" value="{{ cliente.nombre }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Diseño / Zona</label>
                                <input type="text" class="form-control" name="tatuaje" value="{{ cliente.tatuaje }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nueva Fecha de Cita</label>
                                <input type="date" class="form-control" name="fecha" value="{{ cliente.fecha }}" required>
                            </div>
                            <div class="d-flex justify-content-between mt-4">
                                <a href="/dashboard" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-warning">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
