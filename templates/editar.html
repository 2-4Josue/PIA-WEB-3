<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Ritual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Conectamos tu mismo archivo CSS darks -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center vh-100">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">Alterar el Destino</div>
                    <div class="card-body p-4">
                        <form method="POST" action="/editar/{{ id }}">
                            <div class="mb-3">
                                <label class="form-label text-secondary">Alma / Cliente</label>
                                <input type="text" class="form-control" name="nombre" value="{{ cliente.nombre }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-secondary">Sello / Diseño</label>
                                <input type="text" class="form-control" name="tatuaje" value="{{ cliente.tatuaje }}" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-secondary">Nueva Fecha de Cita</label>
                                <input type="date" class="form-control" name="fecha" value="{{ cliente.fecha }}" required>
                            </div>
                            <div class="d-flex justify-content-between mt-4">
                                <a href="/dashboard" class="btn btn-outline-secondary" style="font-family: 'Cormorant Garamond'; font-size: 1.2rem;">Cancelar</a>
                                <button type="submit" class="btn btn-darks">Reescribir Pacto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
