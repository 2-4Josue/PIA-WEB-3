{% extends 'base.html' %}

{% block title %}Contacto - Aetherwood{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-6">
        <div class="card bg-dark border-secondary border-opacity-25 shadow-lg">
            <div class="card-header text-white fs-5" style="font-family: 'Cormorant Garamond'; background-color: #0b0b0b;">
                Envía tu Propuesta al Oráculo
            </div>
            <div class="card-body p-4">
                
                <!-- Mensaje de éxito si el formulario fue enviado -->
                {% if messages %}
                    <div class="alert alert-danger bg-dark text-danger border-danger mb-4" role="alert">
                      {% for message in messages %} {{ message }} {% endfor %}
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'contacto' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-secondary">Tu Nombre / Alma</label>
                        <input type="text" class="card-body form-control text-light bg-black border-secondary" name="nombre" placeholder="Ej. Alex" required style="background-color: #111 !important; color: #fff !important;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Correo Electrónico</label>
                        <input type="email" class="form-control text-light border-secondary" name="correo" placeholder="correo@dominio.com" required style="background-color: #111 !important; color: #fff !important;">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary">Idea o Descripción del Tatuaje</label>
                        <textarea class="form-control text-light border-secondary" name="mensaje" rows="4" placeholder="Cuéntanos los detalles de tu visión..." required style="background-color: #111 !important; color: #fff !important;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-outline-danger w-100" style="font-family: 'Cormorant Garamond'; font-size: 1.2rem;">Enviar Mensaje al Estudio</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
