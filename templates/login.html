<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherwood Studio - Acceso</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg" id="loginCard" style="display: none;">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 font-monospace">AETHERWOOD</h3>
                        
                        <!-- Alertas de Flask -->
                        {% with messages = get_flashed_messages(category_filter=["error"]) %}
                          {% if messages %}
                            <div class="alert alert-danger" role="alert">
                              {% for message in messages %}
                                {{ message }}
                              {% endfor %}
                            </div>
                          {% endif %}
                        {% endwith %}

                        <form method="POST" action="/">
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="usuario" name="usuario" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-outline-light w-100 mt-3">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            // Animación de jQuery requerida
            $("#loginCard").fadeIn(1000);
        });
    </script>
</body>
</html>
