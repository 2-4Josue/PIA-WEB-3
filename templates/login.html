{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherwood Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Así se carga el CSS en Django -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-2" id="loginCard" style="display: none;">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">AETHERWOOD</h2>
                        
                        {% if messages %}
                            <div class="alert alert-danger bg-dark text-danger border-danger" role="alert">
                              {% for message in messages %} {{ message }} {% endfor %}
                            </div>
                        {% endif %}

                        <form method="POST" action="{% url 'login' %}">
                            <!-- Etiqueta de seguridad obligatoria de Django -->
                            {% csrf_token %}
                            <div class="mb-4">
                                <label class="form-label text-secondary">Usuario</label>
                                <input type="text" class="form-control" name="usuario" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-secondary">Contraseña</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-darks w-100 mt-2">Adentrarse</button>
                            
                            <!-- Enlace para regresar al sitio principal -->
                            <div class="text-center mt-3">
                                <a href="{% url 'inicio' %}" class="text-secondary text-decoration-none small" style="font-family: 'Cormorant Garamond'; font-size: 1.1rem;">← Volver al sitio principal</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#loginCard").fadeIn(1500);
        });
    </script>
</body>
</html>
